- id: TASKS-DECOMP-001
  lens: shared-file extension claim / implementable-without-re-deriving
  severity: 4
  title: tests/behavioral/runner.test.ts is mischaracterized as created fresh by WP04 — it is a pre-existing
    895-line file
  evidence:
  - artifact: 'tasks.md § Ownership note, WP04 bullet (line 12): "tests/behavioral/runner.test.ts (created
      fresh here — FR-013 stale-propagation assertion)"'
  - artifact: 'tasks.md § Subtask Index, T026 (line 82): "tests/behavioral/runner.test.ts (new): `stale`
      field propagation assertion..."'
  - artifact: 'tasks.md § WP05 Dependencies (line 191): "T034 extends WP04''s tests/behavioral/runner.test.ts,
      which does not exist until WP04 creates it."'
  - code: tests/behavioral/runner.test.ts:1-895 — file exists today with 11 pre-existing describe blocks,
      including `describe("personaPrompt rendering", ...)` at line 596-609, the exact area FR-022's purity
      guard (T034) targets
  - artifact: 'plan.md § Project Structure (line 293-296) correctly labels this file `MODIFIED`, not new:
      "tests/behavioral/ └── runner.test.ts # MODIFIED — + personaPrompt purity guard ... + `stale` field
      propagation assertion"'
  - artifact: 'tasks.md § Ownership note, WP04 bullet (line 12): "tests/behavioral/runner.test.ts (created
      fresh here — FR-013 stale-propagation assertion) (IC-04)"'
  - artifact: 'tasks.md § T026: "tests/behavioral/runner.test.ts (new): `stale` field propagation assertion
      ..."'
  - artifact: 'tasks.md § Extension-not-overlap note (line 16): "these two extensions are always sequenced
      after the file''s creating WP has merged" (referring to WP04 as the file''s creating WP)'
  - code: 'tests/behavioral/runner.test.ts:1-895 (file exists pre-mission, 895 lines, 12 pre-existing
      describe blocks: FR-022 k-of-n grading, personaPrompt rendering, C-006 makeClient, C-004/directive
      5 source hygiene, etc. — confirmed present at HEAD db80a42, not created by this mission)'
  - artifact: 'plan.md § Project Structure (line 293-296): correctly marks this file `MODIFIED`, not new:
      "tests/behavioral/ └── runner.test.ts # MODIFIED — + personaPrompt purity guard (FR-022...) + `stale`
      field propagation assertion (FR-013)"'
  claim: 'tasks.md repeatedly and explicitly states that `tests/behavioral/runner.test.ts` does not exist
    until WP04 creates it ("created fresh here", "(new)", "does not exist until WP04 creates it"). This
    directly contradicts the actual codebase (the file already exists at 895 lines with substantial pre-existing
    coverage — `personaPrompt rendering`, `C-006 makeClient`, `FR-023 transcript completeness`, `behavioral
    manifest loader`, etc.) and contradicts plan.md''s own Project Structure section, which correctly
    marks the file `MODIFIED`. This also undermines the mission-derived "extension-not-overlap" note''s
    own reasoning: it frames the file''s lineage as a clean two-party WP04-creates → WP05-extends chain,
    when the real lineage is three-party (pre-existing file → WP04 adds a `stale`-propagation test → WP05
    adds a `personaPrompt` purity test). The practical risk is concrete: an implementing agent following
    T026''s "(new)" instruction could use a file-creation tool that overwrites the existing file, destroying
    ~895 lines of unrelated pre-existing test coverage (11 describe blocks spanning FR-022/FR-023/C-004/C-005/C-006
    and more) rather than adding one new test case to it.

    '
  remediation: 'Correct every occurrence to "MODIFIED"/"extends the existing file", matching plan.md and
    the codebase: tasks.md line 12 ("created fresh here" → "extended here — pre-existing file, FR-013
    stale-propagation assertion added"), line 82 (T026: "(new)" → "(existing file, extended)"), and line
    191 ("which does not exist until WP04 creates it" → "which already exists and is first extended by
    WP04, then further extended by WP05"). Also update T026''s own text to instruct adding the new `describe`/`it`
    block to the existing file rather than implying file creation, and note in WP04''s Independent-test
    / Risks section that the diff for this file must be an addition, not a rewrite.

    '
  merged_from:
  - TASKS-COVER-001
  refute_reason: All three cited tasks.md lines (12, 82, 191) verified verbatim and mischaracterize tests/behavioral/runner.test.ts
    as new/created-by-WP04, while the file is confirmed at HEAD db80a42 to already exist at 895 lines
    with pre-existing coverage (e.g. describe("personaPrompt rendering") at line 596), and plan.md line
    293-296 correctly labels the same file MODIFIED.
- id: TASKS-DECOMP-003
  lens: no padding, no vacuous tasks
  severity: 3
  title: T038's NFR-005 coverage check has an unfalsifiable done-condition and never invokes the repo's
    existing local coverage command
  evidence:
  - artifact: 'tasks.md § T038 (line 94): "confirm the new cassette-module code is positioned to clear
      SonarCloud''s ≥80%-new-code coverage gate (lcov-uploaded, checked cross-cuttingly per NFR-005)"'
  - artifact: 'tasks.md § WP06 Independent test (lines 200-201): only "pnpm test and tsc --noEmit both
      green ... tests/cassette/public-api.test.ts imports ... successfully" — no coverage-specific check
      is listed as part of WP06''s own done-condition'
  - code: 'package.json:77 — `"test:coverage": "vitest run --coverage"` (existing script, unused by any
      task in tasks.md)'
  - code: vitest.config.ts:11-15 — coverage provider v8, reporters ["text","lcov"], include ["src/**"]
      — already configured to produce exactly the lcov + per-file text summary NFR-005 needs
  claim: 'T038 is the only place in tasks.md where NFR-005 (≥80% new-code coverage) is checked, and its
    wording ("confirm ... is positioned to clear") is not a falsifiable done-condition — an implementer
    could satisfy it by asserting confidence without ever running a coverage tool, since no other task
    or gate in the mission (T004/T007/T019/T027/T035 all check only `pnpm test`/`tsc --noEmit`) touches
    coverage either. The repository already has `pnpm test:coverage` wired to `vitest run --coverage`
    with lcov + text reporters over `src/**`, which would give an actual measured percentage per new file
    — this task never references it. Given the charter states the SonarCloud coverage gate blocks the
    PR, discovering a shortfall only at CI time (after all six WPs are merged) means rework has to be
    retrofitted into whichever WP under-tested, undermining the mission''s own stated rationale for running
    gates "at the close of every WP ... to catch regressions before they compound" (tasks.md § Gates,
    line 263).

    '
  remediation: 'Reword T038 to require running `pnpm test:coverage` and inspecting the lcov/text summary
    for each new file (`src/core/cassette/*.ts`, `src/core/ execution-source.ts`, and the touched lines
    of `src/adapters/openclaw-sop/ runner.ts`, `src/cli/index.ts`, `src/core/behavioral/{types,client,runner}.ts`),
    asserting each meets or exceeds 80% line/branch coverage — not merely asserting the code is "positioned
    to" pass. Optionally add the same check as a lightweight step to each WP''s own verification gate
    (T004/T007/T019/T027/T035) for its own new files, so a coverage shortfall surfaces at the WP that
    introduced it rather than only at the mission-closing WP06 gate.

    '
  refute_reason: T038's line-94 wording is verbatim as quoted and is the sole NFR-005 touchpoint (T004/T007/T019/T027/T035
    confirmed to check only pnpm test/tsc --noEmit, and WP06's own Independent test line at 200-201 omits
    coverage entirely), package.json:77 and vitest.config.ts:11-15 confirm the unused test:coverage script
    and matching lcov/text v8 config exactly as cited, and "confirm ... is positioned to clear" is genuinely
    softer/non-falsifiable compared to the concrete, measurable done-conditions used elsewhere in the
    same document (e.g. T030's 2 MiB threshold, T028's algorithmic spec).
- id: TASKS-ORDER-001
  lens: Parallel markers
  severity: 3
  title: T028 and T030 both marked [P] target the identical file, violating the mission's own [P] definition
  evidence:
  - artifact: tasks.md § Subtask Index, T028 and T030 rows (lines 84, 86)
  - artifact: tasks.md § WP05 description (line 178) — both tasks write into `tests/unit/invariants.test.ts`
  - artifact: tasks-template.md § Subtask Format — canonical definition
  - code: /home/jeroennouws/.kittify/missions/software-dev/templates/tasks-template.md:18 — "[P] indicates
      the subtask can proceed in parallel (different files/components)."
  claim: 'T028 (NI-004 scan + algorithm) and T030 (fixtures/cassettes size lint) are both marked [P] in
    the Subtask Index, and both are explicitly described as editing the same file, `tests/unit/invariants.test.ts`
    (T028: "folded into the existing combined timer"; T030: "folded into the same combined timer" — the
    identical timer variable in the identical file). This directly contradicts the mission''s own [P]
    convention, which defines the marker as meaning "different files/components" (tasks-template.md line
    18). No other pair of [P]-marked subtasks in tasks.md shares a file (T001/T005/T008/T012/T036 each
    target distinct files); T028/T030 is the sole violation. WP05''s prose (line 192) tries to explain
    this away by noting the tasks "still wait for Phase 3 to start" and are owned by one WP, but that
    reasoning is not encoded in the marker itself — a marker readable at face value as "safe to work concurrently"
    on two edits that must interleave into the same shared timer construct in the same file is a genuine
    same-file collision risk if ever taken literally (e.g. by future subtask-level dispatch tooling, or
    a reviewer skimming the table rather than the prose).

    '
  remediation: 'Remove the [P] marker from one of T028/T030 (or both) in the Subtask Index table, since
    they are same-file edits per the mission''s own definition of [P]. If the intent is genuinely "no
    ordering dependency between these two, but still same-writer/same-file," add an explicit note next
    to the table (as is already done in the WP05 prose) clarifying that this specific [P] usage is scoped
    to "no data dependency" rather than "safe for concurrent writers," so the marker is not misread as
    license for two separate agents/threads to edit `tests/unit/invariants.test.ts` at the same time.

    '
  refute_reason: Verified directly against tasks.md lines 84 and 86 that T028 and T030 are both marked
    [P] and both target the identical file tests/unit/invariants.test.ts (folded into the "same combined
    timer"), which literally contradicts tasks-template.md:18's definition of [P] as "different files/components"
    (confirmed verbatim), and no other [P]-marked pair in the Subtask Index shares a file, making this
    a genuine, isolated violation not cured by the WP05 prose (line 192), which explains intent but does
    not change the marker itself.
- id: TASKS-ORDER-002
  lens: Dependency correctness
  severity: 2
  title: WP03 prose claims T012 depends on T008, contradicted by the Subtask Index's own [P] marking and
    by the actual code
  evidence:
  - artifact: 'tasks.md § WP03, Dependencies bullet (line 150): "T009 (hash) and T012 (hostnameOf export)
      can proceed in parallel with each other once T008 lands"'
  - artifact: tasks.md § Subtask Index, T008 and T012 rows (lines 64, 68) — both marked [P], the same
      tier as WP01/WP02's zero-prerequisite entry tasks T001/T005
  - code: 'src/core/behavioral/client.ts:57 — function hostnameOf(baseUrl: string): string { ... } — a
      standalone function with no reference to src/core/cassette/types.ts or any type T008 introduces'
  claim: 'T012 is a one-line edit adding `export` to the existing `hostnameOf` function in `src/core/behavioral/client.ts:57`,
    a file with no import relationship to `src/core/cassette/types.ts` (T008''s file). The WP03 Dependencies
    prose nonetheless groups T012 with T009 as a task that "can proceed in parallel... once T008 lands,"
    implying T012 is gated behind T008. This is inconsistent with the Subtask Index, which marks T012
    [P] at the same tier as T008 itself (i.e., a task with no prerequisite, able to start immediately)
    — and inconsistent with the actual code, which shows T012 has zero relationship to T008''s output.
    Read literally, the prose would have an implementer needlessly sequence a trivial, fully independent
    one-line edit behind WP03''s riskiest task (T008/types.ts), which is also explicitly called out elsewhere
    in the same WP03 section as "the riskiest, least-precedented concern in the mission" — an odd task
    to gate a zero-risk one-liner behind for no functional reason.

    '
  remediation: 'Correct the WP03 Dependencies prose to state that T012 has no dependency on T008 — it
    can start immediately, in parallel with T008 (matching its own [P] marking in the Subtask Index) —
    since it touches an unrelated file with no shared types. If the intent actually was to gate T012 behind
    T008 for some reason not captured in the current text, remove the [P] marker from T012 in the Subtask
    Index instead so the table and prose agree.

    '
  refute_reason: tasks.md line 150 verified verbatim groups T012 with T009 as gated "once T008 lands"
    despite the same sentence's own T008-prerequisite list (T009-T011/T013) excluding T012, and src/core/behavioral/client.ts:57's
    hostnameOf is confirmed to import nothing from src/core/cassette/types.ts, so the prose asserts a
    functional dependency the code does not have.
