findings:
  - id: PLAN-VERIFY-001
    lens: "[mission-derived] Byte-stability and determinism testing"
    severity: 5
    title: "NFR-002's 'byte-identical replay --json twice' claim conflicts with the pre-existing, always-populated Transcript.durationMs field"
    evidence:
      - artifact: "plan.md § Test Strategy, row 6 (\"Same replay run twice → byte-identical `--json` | `tests/unit/cli.test.ts`\")"
      - artifact: "plan.md § Technical Context, \"Performance Goals\" (\"byte-stable, deterministic recording/replay (NFR-001/002)\")"
      - artifact: "plan.md § Determinism/byte-stability verification paragraph (only addresses NFR-001 store.test.ts and NFR-002 cli.test.ts as \"round-trip tests that record/replay twice and diff the resulting bytes\" — no mention of durationMs neutralization for the replay case)"
      - code: "src/core/behavioral/types.ts:88 (Transcript.durationMs: number — required, not optional)"
      - code: "src/core/behavioral/runner.ts:572 (durationMs: Date.now() - started, computed unconditionally by runCase around the whole case's turn loop, independent of the cassette decorator)"
    claim: >
      RunVerdict.transcript.durationMs is a required field, computed in runCase
      via real wall-clock Date.now() diffing around executeRun's turn loop —
      this happens identically whether the client is live, cassette-record, or
      cassette-replay decorated, since the decorator sits underneath
      client.chat() and runCase's timing wrapper has no cassette awareness.
      NFR-002 requires "running [replay] twice yields byte-identical verdict
      `--json`" with no modulo clause (unlike NFR-001, which explicitly says
      "modulo the opt-in durationMs field" for the persisted cassette files).
      Two consecutive `--replay` invocations of the same suite will measure
      slightly different wall-clock durations for the in-process replay loop
      (file I/O + JS scheduling jitter), so the emitted `--json` verdicts
      array — which embeds this Transcript.durationMs on every RunVerdict —
      is not actually guaranteed byte-identical run over run. This is a
      distinct field from the cassette module's own opt-in
      CassetteExchange.durationMs (correctly excluded from NFR-001's
      comparison per FR-004); the plan's Hazard 1/Hazard 2 sections
      pre-empt two other subtle interactions but do not address this one,
      and no design decision or IC neutralizes/zeroes this field for replay
      output.
    remediation: >
      Add an explicit design decision (alongside Hazard 1/2) stating how
      replay mode keeps `--json` output byte-identical across runs despite
      Transcript.durationMs: either (a) doBehaveRun's replay path
      zeroes/normalizes transcript.durationMs before emitting verdicts (e.g.
      always 0, since replay makes no real timed network call), or (b) runCase
      is made cassette-aware enough to skip real timing when the decorator is
      in replay mode, or (c) NFR-002's acceptance criterion and the row-6 test
      are explicitly amended to be "modulo durationMs" like NFR-001, if a
      literal byte-identical guarantee is not actually achievable. Whichever
      is chosen, add a corresponding assertion to the scenario-6 test in
      tests/unit/cli.test.ts that would fail if the chosen mechanism were
      absent (e.g. run replay twice with an artificial delay injected into
      file-read timing and confirm the two --json payloads are still
      byte-identical).

  - id: PLAN-VERIFY-002
    lens: "[mission-derived] NI-004 guard feasibility"
    severity: 4
    title: "NI-004's 'scan runner files for Promise.all wrapping a .chat(/.chatWithTools( call site' is underspecified and, if implemented in NI-002/NI-003's existing simple-substring style, already false-positives on two real files"
    evidence:
      - artifact: "plan.md § IC-05 Risks (\"NI-004's `Promise.all` scan needs a token that does not trigger on itself (mirroring NI-003's `FETCH_CALL = \"fetch\" + \"(\"` self-exemption trick...) — the scan pattern must be built the same way (string concatenation)\")"
      - artifact: "plan.md § Project Structure, tests/unit/invariants.test.ts bullet (\"+ NI-004 (Promise.all-around-chat scan, FR-024/C-006)\")"
      - artifact: "spec.md FR-024 (\"a fourth automated guard (NI-004) that scans all runner files for a `Promise.all` call wrapping a `.chat(`/`.chatWithTools(` call site... analogous to the existing NI-002/NI-003 pattern\")"
      - code: "tests/unit/invariants.test.ts:107-121 (NI-002: a per-line `line.includes(\"adapters\")` substring check) and :128-152 (NI-003: `content.indexOf(FETCH_CALL)` whole-file substring check) — the two existing guards this mission is told to mirror are both flat substring/co-occurrence checks, not structural/AST checks"
      - code: "src/adapters/memory-utilization/index.ts:7 and :288 (comments containing the literal substring \"Promise.all\", explicitly documenting the ABSENCE of concurrency) and :181 (a real `ctx.client.chat(` call site in the same file)"
      - code: "src/crosslayer/rule-survival.ts:309 (comment containing \"Promise.all\") and :322 (a real `client.chat(` call 13 lines later, in the same file)"
    claim: >
      The plan directs NI-004 to be built "analogous to the existing
      NI-002/NI-003 pattern" — both of which are simple same-file (NI-002) or
      whole-corpus (NI-003) substring/co-occurrence checks, not structural
      parses. FR-024's actual requirement ("a Promise.all call wrapping a
      .chat(/.chatWithTools( call site") is a nesting/enclosure relationship,
      not a co-occurrence — and the codebase already contains two files
      (memory-utilization/index.ts, crosslayer/rule-survival.ts) where the
      literal substring "Promise.all" appears in a comment in the same file
      as, and in rule-survival.ts's case within 13 lines of, a real
      `.chat(`/`.chatWithTools(` call site that documents exactly why
      Promise.all is NOT used there. A naive same-file-co-occurrence or
      small-proximity-window implementation — the style the plan explicitly
      tells the implementer to mirror — would false-positive on existing,
      correct code on day one, breaking the invariant suite (and therefore
      the merge gate) immediately upon landing. The plan's only stated
      mitigation (the FETCH_CALL-style self-exemption trick) addresses
      NI-004's own test file source tripping on itself; it says nothing
      about these two pre-existing, unrelated files.
    remediation: >
      Specify NI-004's actual detection algorithm precisely before /tasks:
      either (a) strip comments before scanning and require the `Promise.all(`
      token to be a syntactic ancestor of the call site (e.g. brace/paren-depth
      tracking to confirm the `.chat(`/`.chatWithTools(` token lies inside the
      argument list opened by a preceding `Promise.all(`), or (b) reuse the
      TypeScript compiler API (already an existing devDependency via `tsc`, so
      no new package.json dependency is introduced) to walk the AST and check
      CallExpression nesting directly instead of text matching. Whichever is
      chosen, add `src/adapters/memory-utilization/index.ts` and
      `src/crosslayer/rule-survival.ts` as explicit must-not-false-positive
      fixtures in NI-004's own test coverage, since both already exist and
      already contain the literal trigger substring today.

  - id: PLAN-VERIFY-003
    lens: "[mission-derived] Zero-network-IO proof"
    severity: 4
    title: "The plan never specifies the interception mechanism for NFR-003's 'zero network I/O' assertion, and the codebase's existing 'muster behave run' test pattern (mock clientFactory) would make the obvious implementation vacuous"
    evidence:
      - artifact: "plan.md § Technical Context, \"Performance Goals\" (\"zero network I/O during replay (NFR-003, verified by test, not merely asserted)\")"
      - artifact: "plan.md § Test Strategy, row 5 (\"Replay with no endpoint/API key env set → completes, zero network I/O | `tests/unit/cli.test.ts` (NFR-002/003)\")"
      - artifact: "plan.md § Project Structure, tests/unit/cli.test.ts bullet (\"zero network I/O during replay (NFR-003)\") — names the location, not the mechanism"
      - code: "tests/unit/cli.test.ts:380,388,397,426,439,454 (every existing `muster behave run` test passes `clientFactory: mockFactory(...)`, a fully in-process fake ChatClient that never touches `fetch` at all — this is the pattern IC-04 explicitly extends, per plan.md's own \"existing `muster behave run` describe block\" note)"
      - code: "tests/unit/cli.test.ts:727 (`vi.spyOn(globalThis, \"fetch\")` — the one place in this test file that actually intercepts real network calls, used for an unrelated BUG-B regression test, not cited or reused anywhere in the plan)"
    claim: >
      "Verified by test, not merely asserted" is stated as a design principle
      but the plan never says which of two structurally different techniques
      the NFR-003 test uses: (a) spy on `globalThis.fetch` directly and assert
      zero calls (the only technique that actually observes network I/O at the
      lowest level, proving the decorator itself never lets a call through),
      or (b) inject a mock ChatClient via `clientFactory` (as every existing
      `muster behave run` test in this file already does) and merely assert
      the mock's spy was not called. Technique (b) is the path of least
      resistance given IC-04 explicitly builds on "the existing `muster behave
      run` describe block," and it would prove nothing about NFR-003 that
      wasn't already true by construction — a mock ChatClient never touches
      the network regardless of whether the decorator correctly intercepts it,
      so a broken decorator that erroneously passed every replay call through
      to the (mock) inner client would still show "zero network I/O" under
      technique (b). This is exactly the vacuous-negative-proof failure mode
      the lens calls out, and the plan gives no signal that the stronger
      fetch-spy technique (b), for which a precedent already exists at
      cli.test.ts:727, is the one required.
    remediation: >
      State explicitly in the plan (Test Strategy row 5, or a new Hazard-style
      callout) that the NFR-003 replay test must spy on `globalThis.fetch`
      (mirroring the existing `vi.spyOn(globalThis, "fetch")` precedent at
      cli.test.ts:727) — or, if it uses a mock `clientFactory`, that the mock
      client's `chat`/`chatWithTools` methods must themselves be spied and
      asserted `not.toHaveBeenCalled()`, so a decorator bug that leaks a call
      through to the inner client is actually caught. Either is acceptable;
      leaving the choice unstated risks the weaker, vacuous version being
      implemented by default since it requires no new test infrastructure.

  - id: PLAN-VERIFY-004
    lens: "[mission-derived] FR-001 regression proof"
    severity: 3
    title: "The planned FR-001 'measured durationMs' regression test risks being indistinguishable from the removed durationMs: 0 literal unless the plan requires an artificial delay"
    evidence:
      - artifact: "plan.md § Test Strategy, row 15 (\"SOP transcript reflects real endpoint + measured duration, no \\\"mock\\\" literal remains | `tests/adapters/openclaw-sop/runner.test.ts`\")"
      - artifact: "plan.md § IC-01 Risks (\"Existing SOP runner tests assert no \\\"mock\\\" literal today (verified live)... only new assertions are added (AC-15)\")"
      - code: "src/adapters/openclaw-sop/runner.ts:191-194,349-354,421-427 (the three current unconditional literals `model: \"mock\"`, `baseUrl: \"mock://test\"`, `durationMs: 0`)"
      - code: "tests/adapters/openclaw-sop/runner.test.ts (grep confirms all 10 occurrences of \"mock\" are prose/comments about mock clients, e.g. lines 7, 47, 63, 74, 79, 114 — none assert on Transcript.model/baseUrl/durationMs field values today, confirming the plan's \"no rewrite needed\" claim but also confirming no pre-existing precedent for how to assert a *measured* durationMs)"
    claim: >
      FR-001's fix makes `runProbeOnce` "time its client-call loop and stamp[]
      ... real model/baseUrl ... instead of the ... 0 literal[]." If the AC-15
      regression test's mock ChatClient resolves synchronously/near-instantly
      (as every existing mock client in this test file does, per the
      "CRITICAL: Zero live network calls" tests), `Date.now() - started` can
      legitimately compute to `0` on a fast machine at ms-granularity — making
      a genuinely-measured duration indistinguishable, byte-for-byte, from the
      exact hardcoded literal FR-001 is supposed to remove. A test that
      asserts merely `durationMs !== undefined` or `typeof durationMs ===
      "number"` would not catch a regression back to the literal `0`; a test
      that happens to assert `durationMs === 0` on a fast mock would pass
      today even with the bug still present, undermining the "regression
      proof" this lens requires. The plan does not specify that the mock
      client used in the AC-15 test must introduce a deliberate delay to make
      the measured value deterministically distinguishable from `0`.
    remediation: >
      Specify in IC-01 (or the Test Strategy row 15 entry) that the AC-15
      regression test's mock ChatClient introduces an artificial async delay
      (e.g. `await new Promise(r => setTimeout(r, 5))` before returning) and
      asserts `durationMs > 0` (or `>= 5`), not just that the field exists or
      is a number — so the test would actually fail if the hardcoded `0`
      literal reappeared.

  - id: PLAN-VERIFY-005
    lens: "Test strategy"
    severity: 3
    title: "The plan-time 'non-empty target directory on --record' decision (overwrite-only-touched-files, never delete untouched files) has no corresponding test anywhere in the Test Strategy table or the IC-02/IC-05 test file lists"
    evidence:
      - artifact: "plan.md § \"Design decisions resolving the spec's 'plan-time' Open Questions\", item 2 (\"overwrite the specific files this run produces... create the directory if absent, and never delete files this run does not touch\")"
      - artifact: "plan.md § Test Strategy table (16 rows, each mapped to one of spec.md's 16 numbered Acceptance Scenarios — none covers non-empty-directory overwrite/non-destructive semantics)"
      - artifact: "plan.md § Project Structure, tests/cassette/store.test.ts bullet (\"FR-003/004/006: file format, ordinal reset/increment, redaction\" — no mention of directory-overwrite behavior)"
    claim: >
      This is a plan-authored, safety-relevant design decision (explicitly
      framed as preventing "silently destroying an unrelated prior recording")
      with no test anywhere in the plan's coverage tables. Because it is not
      one of spec.md's 16 numbered Acceptance Scenarios, it falls outside the
      Test Strategy table's scenario-by-scenario mapping entirely and is easy
      to lose track of at /spec-kitty.tasks time — the plan's own coverage
      claim ("every new file listed in Project Structure gets direct unit
      coverage... No branch is planned that lacks a corresponding test") is
      not actually true for this specific, plan-invented behavior.
    remediation: >
      Add an explicit row (or sub-bullet under store.test.ts) to the Test
      Strategy / Project Structure sections: pre-populate a cassette directory
      with an unrelated file plus a stale case file from a different suite,
      run `--record` for the current suite, and assert (a) the unrelated file
      is untouched and (b) only the current suite's case/index files were
      written or overwritten.

  - id: PLAN-VERIFY-006
    lens: "[mission-derived] NI-004 guard feasibility"
    severity: 2
    title: "The plan does not enumerate which files/directories NI-004 walks, despite C-006's scope being 'all eight behavioral runners' across at least five different directories"
    evidence:
      - artifact: "plan.md § IC-05 (\"NI-004 (FR-024/C-006 — scans runner files for `Promise.all` wrapping a `.chat(`/`.chatWithTools(` call site)\") — quotes FR-024 verbatim, does not name a file set"
      - artifact: "spec.md Dependencies & Assumptions (\"all eight behavioral runners (behave, memory, memory-utilization, crosslayer, heartbeat, skills, sop, tools) execute cases and runs sequentially\")"
      - code: "the eight runners' chat-call sites are scattered across at least five directories/files: src/adapters/skills/trigger.ts, src/adapters/heartbeat/index.ts, src/adapters/memory/{privacy,recall}.ts, src/adapters/memory-utilization/index.ts, src/adapters/openclaw-sop/runner.ts, src/core/behavioral/runner.ts, src/crosslayer/rule-survival.ts — none of which is uniformly named `runner.ts`"
    claim: >
      "Runner files" is not a defined term anywhere in the plan or the
      existing test file's naming conventions (NI-002/NI-003 walk `src/core`
      or all of `src`+`tests`, not a "runner files" subset). Without an
      explicit file list or glob, an implementer could plausibly scope NI-004
      to only `src/**/runner.ts` (missing heartbeat/index.ts, crosslayer's
      files, memory-utilization/index.ts, skills/trigger.ts entirely) and
      still satisfy the plan's own words, silently under-enforcing C-006 for
      five of the eight named runners.
    remediation: >
      Enumerate NI-004's scan scope explicitly in plan.md (either an allowlist
      of files mirroring FETCH_ALLOWED's style, or a walk of `src/adapters/**`
      + `src/core/behavioral/runner.ts` + `src/crosslayer/**`, filtered to
      files containing `.chat(`/`.chatWithTools(` at all), so /spec-kitty.tasks
      has no ambiguity about which files must be covered.
