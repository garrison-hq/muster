    '
- id: PLAN-FIT-002
  lens: '[mission-derived] Out-of-place content'
  severity: 2
  title: '''Tooling note'' recording a spec-kitty scaffold failure sits inside the architecture artifact,
    not the mission''s operational record'
  evidence:
  - artifact: plan.md lines 11-33, the 'Tooling note (transparency, not a state edit)' paragraph, positioned
      between the Branch contract and the Summary section
  claim: 'plan.md''s opening section contains a ~23-line paragraph about a `spec-kitty plan --mission
    ... --json` / `spec-kitty agent mission setup-plan` CLI failure (`SPEC_FILE_MISSING`), its root cause
    in `specify_cli`, and a justification for hand-authoring this file outside the normal scaffold. This
    is pipeline-tooling commentary about how the artifact was produced, not architecture, requirements
    mapping, or design content — the material `/spec-kitty.tasks` and future readers of plan.md need.
    It sits in the most prominent position in the document (before "## Summary"), and its presence risks
    two concrete problems: (1) any downstream tooling that parses plan.md structurally (section headers,
    FR tables) now has to skip past unrelated prose to reach the first real section; (2) a future mission-
    review or drift-audit reading plan.md for "what does the architecture say" has to manually filter
    out an incident report about the spec-kitty CLI itself, which has nothing to do with the cassette
    engine''s design.

    '
  remediation: 'Move the tooling-failure account out of plan.md into the mission''s existing operational
    record — `status.events.jsonl` already exists in this mission directory and is the correct place for
    a state/process anomaly note, or record it as a one-line entry in the PR description per the charter''s
    Exception Policy ("Deviations from ... upstream tooling suggestions require a written one-line justification
    recorded in the mission work log"). Keep plan.md starting at "## Summary" as pure design content;
    a single one-line pointer ("see mission work log for a tooling note about how this file was authored")
    is enough if traceability is wanted in-place.

    '
