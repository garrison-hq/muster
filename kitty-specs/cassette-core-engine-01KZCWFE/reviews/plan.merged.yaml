- id: PLAN-VERIFY-006
  lens: '[mission-derived] NI-004 guard feasibility'
  severity: 2
  title: The plan does not enumerate which files/directories NI-004 walks, despite C-006's scope being
    'all eight behavioral runners' across at least five different directories
  evidence:
  - artifact: plan.md § IC-05 ("NI-004 (FR-024/C-006 — scans runner files for `Promise.all` wrapping a
      `.chat(`/`.chatWithTools(` call site)") — quotes FR-024 verbatim, does not name a file set
  - artifact: spec.md Dependencies & Assumptions ("all eight behavioral runners (behave, memory, memory-utilization,
      crosslayer, heartbeat, skills, sop, tools) execute cases and runs sequentially")
  - code: 'the eight runners'' chat-call sites are scattered across at least five directories/files: src/adapters/skills/trigger.ts,
      src/adapters/heartbeat/index.ts, src/adapters/memory/{privacy,recall}.ts, src/adapters/memory-utilization/index.ts,
      src/adapters/openclaw-sop/runner.ts, src/core/behavioral/runner.ts, src/crosslayer/rule-survival.ts
      — none of which is uniformly named `runner.ts`'
  claim: '"Runner files" is not a defined term anywhere in the plan or the existing test file''s naming
    conventions (NI-002/NI-003 walk `src/core` or all of `src`+`tests`, not a "runner files" subset).
    Without an explicit file list or glob, an implementer could plausibly scope NI-004 to only `src/**/runner.ts`
    (missing heartbeat/index.ts, crosslayer''s files, memory-utilization/index.ts, skills/trigger.ts entirely)
    and still satisfy the plan''s own words, silently under-enforcing C-006 for five of the eight named
    runners.

    '
  remediation: 'Enumerate NI-004''s scan scope explicitly in plan.md (either an allowlist of files mirroring
