feedback:
  - id: WP03-C1-001
    severity: 2
    claim: >
      FR-012 (this WP's own requirement_refs list, WP03-cassette-core-module.md
      line 16) mandates that "the cassette format documentation MUST
      explicitly name the ChatClient.chat() information-loss limitation
      (only choices[0].message.content survives that seam — finish_reason,
      usage, additional choices, and the server-echoed model are discarded
      before it reaches cassette code) and state that cassette provenance
      records the requested model, never the served one, and MUST state the
      resulting chat/chatWithTools fidelity asymmetry" (spec.md FR-012 row).
      The only doc-comment addressing this anywhere in
      src/core/cassette/*.ts is types.ts:28-30, a single parenthetical on
      the `model` field: "(FR-012: `ChatClient.chat()` discards the
      server-echoed model before it reaches cassette code)". That covers
      only the "requested vs. served model" half of FR-012's three MUSTs.
      It never names finish_reason, usage, or additional choices as
      discarded, and it never states the "chat/chatWithTools fidelity
      asymmetry" FR-012 explicitly requires — namely that a `chat` exchange
      records only the single lossy `response: string`
      (`CassetteExchange`'s `kind: "chat"` branch, types.ts:69-70) while a
      `chatWithTools` exchange records the full raw `response: unknown`
      payload (types.ts:78-79), so replaying a `chatWithTools` case
      preserves strictly more of the original server response than
      replaying a `chat` case does. No README, module-level doc block, or
      other file in the diff states this asymmetry anywhere; grepping
      src/core/cassette/ for "usage", "finish_reason", or "asymmetry"
      returns no hits. This is a documentation-only gap (no runtime
      behavior is wrong — the asymmetry itself is real and by design,
      matching FR-011's "not re-serialized into chat's shape"), but FR-012
      is phrased as an unambiguous MUST and is explicitly in this WP's
      scope, not deferred to a later WP.
    remediation: >
      Extend the doc comment on `CassetteExchange` (types.ts:49-60, where
      the `kind` discriminator and its rationale already live) or add a
      dedicated paragraph to the module-level comment at the top of
      types.ts to: (1) name the specific fields ChatClient.chat() discards
      before cassette code ever sees them — finish_reason, usage, additional
      choices, and the server-echoed model — leaving only
      choices[0].message.content; and (2) explicitly state the resulting
      fidelity asymmetry — chat exchanges retain only the extracted string,
      chatWithTools exchanges retain the full raw response payload — so a
      future reader of the cassette format (e.g. a wave-2 consumer deciding
      whether replay is safe for their use case) does not have to infer it
      from the type shapes alone.
