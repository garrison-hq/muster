findings:
- id: SPEC-ARCH-001
  lens: Wave-2 resolver contract
  severity: 4
  title: Execution-source resolver contract is unspecified against the four commands' genuinely divergent
    existing endpoint-configured checks
  evidence:
  - artifact: spec.md § FR-018
  - artifact: spec.md § C-005
  - artifact: spec.md § SC-006
  - code: 'src/cli/index.ts:936-943 (crosslayer: falls back to static-only only after catching an error
      whose message includes both "endpoint" and "required" - i.e. its ''configured execution source''
      signal is env var OR manifest endpoint-block presence, detected via error-message substring matching,
      not a boolean check)'
  - code: 'src/cli/index.ts:1616-1646 (sop: buildSopClient/SOP_NOOP_CLIENT - configured-or-not is purely
      process.env["MUSTER_ENDPOINT"] presence)'
  - code: 'src/adapters/heartbeat/index.ts:497 (heartbeat: purely process.env["MUSTER_ENDPOINT"] presence)'
  - code: 'src/adapters/skills/trigger.ts:83-92 (skills: MUSTER_ENDPOINT canonical, MUSTER_BASE_URL deprecated
      alias - a third distinct precedence shape)'
  claim: FR-018/C-005/SC-006 assert one core-exported resolver function that all three wave-2 missions
    (#100/#101/#102, covering skills/sop/crosslayer/heartbeat's gate-bearing surfaces) will consume "without
    modification to src/core/". The spec's entire documented contract for that resolver is one sentence
    -- "a replay-configured cassette counts as a configured execution source" -- with no stated input
    signature (does it take CLI opts, an env snapshot, the manifest's endpoint block, or all three). Grep
    of the actual current implementations shows the four commands do NOT share one shape today. crosslayer's
    endpoint-configured check is env-var-OR-manifest-endpoint-block, detected by catching and string-matching
    an error message from runCrossLayerManifest; sop and heartbeat check only the env var; skills additionally
    resolves a deprecated alias. A resolver built to the spec's one-line contract (env var vs. cassette
    only) will not, as written, cover crosslayer's manifest-endpoint-block signal, so at least one of
    the three wave-2 missions is likely to need a src/core/ change to accommodate it -- directly contradicting
    the "without modification" guarantee C-005/SC-006 make.
  remediation: Before tasks are cut, define the resolver's concrete input contract (parameters and precedence
    order) and show, in the plan, that it can replace all four existing call sites (heartbeat/index.ts:497,
    cli/index.ts:936-943 crosslayer, cli/index.ts:1616-1646 sop, skills/trigger.ts:83-92) verbatim --
    or explicitly narrow FR-018/C-005's promise to the subset of commands whose check is a bare env-var/cassette
    test, and flag crosslayer's manifest-endpoint-block signal as a known wave-2 core-change risk rather
    than implying it is already covered.
  refute_reason: Verified all four cited call sites verbatim (cli/index.ts:936-943 error-message substring
    match, cli/index.ts:1616-1646 buildSopClient/SOP_NOOP_CLIENT env-only check, heartbeat/index.ts:497
    env-only check, skills/trigger.ts:83-92 canonical+deprecated-alias precedence) and confirmed FR-018/C-005/SC-006
    give the resolver only a one-sentence contract with no input signature, so the "consume without modification"
    guarantee is genuinely unsupported by the spec text.
- id: SPEC-COMPLETE-001
  lens: coverage
  severity: 4
  title: FR-005's post-blinding hash-timing requirement has zero acceptance-scenario coverage
  evidence:
  - artifact: spec.md § FR-005 (line 211)
  - artifact: spec.md § Acceptance Scenarios (lines 119-178) and § Edge Cases (lines 180-199)
  - code: src/adapters/memory-utilization/rubric.ts:234-245 (blindArmOrder — the real, deterministic arm-order
      transform FR-005 is presumably guarding against)
  claim: 'FR-005 is a MUST requirement central to this mission''s own "hash/ordinal determinism" concern:
    the request hash must be computed AFTER any blinding/arm-ordering transform, never over a pre-blinding
    logical probe identity. The words "blind" and "arm-order" appear exactly once in the entire spec —
    inside FR-005 itself — and nowhere in any of the 14 Acceptance Scenarios, the Edge Cases section,
    or the Key Entities'' "Request hash" definition (lines 280-282, which only says "the canonical-JSON
    hash of the fully-built, post-transform request" without an AC exercising the pre- vs. post-transform
    distinction). A real, deterministic blinding transform already exists in the codebase (`blindArmOrder`
    in src/adapters/memory-utilization/rubric.ts:234, used for judge arm-order blinding per that file''s
    FR-011/NFR-001 doc comments), so this is not a hypothetical edge case — it is a real code path that
    could silently hash the wrong (pre-blinding) request identity and nobody would notice, because no
    acceptance scenario checks it. This satisfies the severity-4 bar ("FR without coverage").

    '
  remediation: 'Add an explicit Acceptance Scenario (or Edge Case) under "Recording" or "Discrimination
    control" that: given a case whose request undergoes a blinding/arm-ordering transform before being
    sent, when two calls carry the same post-transform request but different pre-transform probe identities
    (or vice versa), then the recorded/replayed request-hash keys reflect the post-transform form — i.e.,
    a test that would fail if the hash were computed over the pre-blinding identity instead.

    '
  refute_reason: FR-005 (spec.md:211) is the only place "blind"/"arm-order" appear in the spec, no Acceptance
    Scenario (119-178) or Edge Case (180-199) exercises a pre- vs post-transform hash distinction, and
    blindArmOrder (rubric.ts:234) confirms such a transform genuinely exists in the codebase and is applied
    before a ChatClient.chat call (judge.ts:131-138), so the MUST requirement is verifiably uncovered.
- id: SPEC-COMPLETE-002
  lens: determinism
  severity: 4
  title: tools/selection.ts's behavioral probes bypass the ChatClient/ToolChatClient seam entirely, contradicting
    the spec's foundational 'one seam' premise
  evidence:
  - artifact: 'spec.md § Summary (lines 16-21): "muster today has one seam every chat-based command calls
      through: ChatClient.chat / ToolChatClient.chatWithTools"'
  - artifact: 'spec.md § Non-Goals (lines 53-55): lists "tools" among "the other six chat-based commands"
      that wave-2 wires cassette support into'
  - code: 'src/adapters/tools/selection.ts:141 (`export type FetchFn = (url: string, init: RequestInit)
      => Promise<Response>;`)'
  - code: src/adapters/tools/selection.ts:520-530 (`runSelectionCase` resolves `httpFetch` from an injected
      `FetchFn`, defaulting to `globalThis.fetch` — no `ChatClient`/`ToolChatClient` import anywhere in
      the file)
  claim: 'The mission''s entire architecture (FR-002, FR-007, C-005, SC-006) rests on the premise that
    every live behavioral call in the codebase passes through the single `ChatClient`/`ToolChatClient`
    seam that `makeCassetteClient` wraps. This is false for the tools adapter''s behavioral tool-selection
    probes: `src/adapters/tools/selection.ts` imports only `TOOLSFile` from `./lint.js` and implements
    its own direct HTTP call via an injectable `FetchFn` (default `globalThis.fetch`), deliberately avoiding
    the literal "fetch(" token to stay out of NI-003''s `FETCH_ALLOWED` scan (per the file''s own comment
    at lines 18-21). Since the cassette decorator only wraps `ChatClient`/`ToolChatClient` instances,
    it cannot intercept `tools/selection.ts`''s calls no matter how it is wired — meaning the spec''s
    own Non-Goals claim that a later wave-2 mission can "wire cassette support into" the tools adapter''s
    "gate-bearing CLI surface" is not actually achievable with the decorator this mission ships, without
    an unstated prerequisite refactor of the tools adapter onto the ChatClient seam. This directly contradicts
    existing code (severity-4 criterion).

    '
  remediation: 'Either (a) narrow the Summary''s "one seam" claim and the Non-Goals'' "six chat-based
    commands" list to exclude `tools`, and note as a Dependency/Risk that the tools adapter''s behavioral
    probes need a ChatClient-seam refactor before any wave-2 cassette wiring is possible, or (b) if tools''
    cassette support is still intended for wave 2, add an explicit Non-Goal/Dependency stating that `tools/selection.ts`
    must first be migrated onto `ChatClient`/`ToolChatClient` (a prerequisite not covered by this mission
    or any named wave-2 mission today).

    '
  refute_reason: Verified in code that src/adapters/tools/selection.ts (FetchFn type at line 141, runSelectionCase
    resolving httpFetch at 528-530) imports only TOOLSFile from ./lint.js and is called from src/adapters/tools/index.ts
    with zero ChatClient/ToolChatClient involvement, directly contradicting spec.md's Summary claim that
    every chat-based command (which explicitly lists "tools" in Non-Goals) goes through the ChatClient/ToolChatClient
    seam.
- id: SPEC-ARCH-002
  lens: Decorator seam feasibility
  severity: 3
  title: chatWithTools decoration has no acceptance-scenario or CLI exercise path within this mission
  evidence:
  - artifact: spec.md § FR-007
  - artifact: spec.md § D4
  - artifact: spec.md § FR-011
  - artifact: spec.md § Non-Goals ("The other six chat-based commands (skills run, ...) - M17 (#100)...
      wire cassette support into their own gate-bearing CLI surfaces.")
  - code: 'src/cli/index.ts:157-159 (clientFactory?: (endpoint: EndpointConfig) => ChatClient -- behave
      run''s only injected client type; no ToolChatClient variant exists on RunCliOptions)'
  - code: 'src/core/behavioral/runner.ts:255,384 (the behave-run engine takes client: ChatClient and only
      ever calls client.chat(...); chatWithTools is never invoked anywhere in this file)'
  - code: 'src/adapters/skills/trigger.ts:115-122 (the only chatWithTools-shaped consumer in the tree
      is the adapter-private TriggerChatClient, signature chatWithTools(userMessage: string, tools: ToolDefinition[]):
      Promise<string | null> -- structurally different from core''s ToolChatClient.chatWithTools(messages:
      ChatMessage[], tools: unknown[]): Promise<unknown> that FR-007 cites at client.ts:105-111)'
  claim: 'D4 declares chatWithTools "in scope for v1" and FR-007/FR-011 require makeCassetteClient to
    decorate and record/replay it, but this mission''s only wired CLI surface (behave run, per FR-016/FR-017)
    never calls chatWithTools -- its client factory type is plain ChatClient, and the runner engine only
    ever calls .chat(). The one real chatWithTools consumer in the codebase (skills run) is explicitly
    Non-Goal/wave-2 work, and it doesn''t even use core''s ToolChatClient shape directly -- it wraps makeClientWithTools''s
    output behind its own differently-shaped adapter interface. None of the 14 Acceptance Scenarios in
    this spec exercises chatWithTools. The result: chatWithTools decoration can only be validated by synthetic
    core-level unit tests built directly against makeClientWithTools''s return value, with no acceptance-level
    scenario in this spec demonstrating it end-to-end -- a real risk that this surface is under-specified/under-tested
    until wave 2 discovers a gap.'
  remediation: Add an explicit Acceptance Scenario (or FR) describing a chatWithTools-specific record/replay
    test built directly against a ToolChatClient instance (bypassing any CLI, since none exists in this
    mission), so the plan phase designs deliberate integration-level coverage rather than leaving it implicit.
    Note explicitly that TriggerChatClient (skills/trigger.ts) is not core's ToolChatClient and is incompatible
    in shape, so wave-2's skills-run integration will need its own adapter-level wrapping around the decorated
    core client, not a drop-in swap.
  refute_reason: Verified RunCliOptions (cli/index.ts:157-159) has only a plain ChatClient factory and
    a separately-typed TriggerChatClient factory (no ToolChatClient variant), runner.ts:255/384 only ever
    calls client.chat, skills/trigger.ts:115-122 TriggerChatClient is structurally distinct from core's
    ToolChatClient, and none of the 14 Acceptance Scenarios (only an Edge Case bullet) exercises chatWithTools,
    all matching the finding's citations exactly.
