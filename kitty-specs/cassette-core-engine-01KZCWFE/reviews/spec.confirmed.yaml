- id: SPEC-COMPLETE-004
  lens: testability
  severity: 3
  title: FR-013/AC-8's 'labeled distinctly as staleness' has no specified mechanism, and the existing
    verdict shape only carries a free-text error string
  evidence:
  - artifact: 'spec.md § FR-013 (line 219): "MUST be labeled distinctly as staleness (not generic conformance
      failure) in the run/case output"'
  - artifact: 'spec.md § Acceptance Scenario 8 (lines 150-153): "the affected run fails and is labeled
      distinctly as stale"'
  - code: 'src/core/behavioral/types.ts:102-108 (`RunVerdict` — the only error-carrying field is `error?:
      string`, free text, no kind/reason enum)'
  claim: 'Neither FR-013 nor AC-8 specifies HOW a staleness failure is distinguished from any other errored
    run in the report/`--json` shape. The only existing mechanism (`RunVerdict.error?: string`, types.ts:107)
    is an untyped free-text message. Two equally literal readings of "labeled distinctly" both satisfy
    the AC as written: (a) embed a recognizable substring/prefix in the free-text `error` message, or
    (b) add a new structured field (e.g. an additive `stale?: boolean` alongside the `passRate`/`replayed`
    precedent FR-017 already establishes). These are not equivalent for a downstream consumer (e.g. a
    CI dashboard programmatically distinguishing staleness from a real conformance regression per SC-003)
    — one is string-matching-fragile, the other is a stable contract. NFR-006 requires any change to stay
    additive/byte-stable for non-replay paths, which argues for (b), but the spec never says so, leaving
    this open to two implementers landing on different, incompatible mechanisms across work packages.

    '
  remediation: 'Add a line to FR-013 (or a new FR) specifying the concrete mechanism: e.g. "a new additive,
    optional field (name TBD at plan time) on `RunVerdict`/`CaseVerdict` distinguishes a staleness failure
    from any other error, consistent with the additive field precedent set by `passRate` and `replayed`"
    — so the plan phase has one, not two, compatible options to choose from.

    '
  refute_reason: Confirmed RunVerdict (types.ts:102-108) and CaseVerdict (types.ts:124-137) both carry
    only an untyped error?/passRate field with no stale/kind indicator, and FR-013/AC-8 text (verified
    against spec.md) genuinely leaves the "labeled distinctly as staleness" mechanism unspecified between
    two incompatible readings.
- id: SPEC-COMPLETE-005
  lens: security
  severity: 3
  title: hostnameOf, the exact redaction function FR-004/C-004 cite as the pattern to match, is private/unexported
    — no constraint forbids a parallel, potentially-diverging redaction implementation
  evidence:
  - artifact: 'spec.md § FR-004 (line 210): "minimal provenance limited to the model name and the endpoint
      hostname only"'
  - artifact: 'spec.md § C-004 (line 250): "matching the client''s existing error-hygiene convention (hostnameOf
      in client.ts)"'
  - artifact: 'spec.md § C-003 (line 249, contrast): explicitly forbids "a parallel canonicalization implementation"
      and mandates reuse of `canonicalJson`'
  - code: 'src/core/behavioral/client.ts:57 (`function hostnameOf(baseUrl: string): string {` — no `export`
      keyword; confirmed via `grep -n "^export" src/core/behavioral/client.ts`, which lists `EmptyResponseError`,
      `ToolChatClient`, `makeClientWithTools`, `makeClient` — `hostnameOf` is absent)'
  claim: 'C-003 explicitly closes the door on a parallel canonical-JSON implementation by requiring reuse
    of the existing `canonicalJson` export. FR-004/C-004 cite `hostnameOf` as the exact convention the
    new cassette module''s redaction must match, but `hostnameOf` is a private, unexported function (client.ts:57)
    — the new cassette module (which per FR-002 must import no adapter code, but CAN import other core
    files) has no way to literally reuse it without a change to client.ts, and the spec never says this
    export needs to happen. Absent an explicit reuse requirement, an implementer may instead write a second,
    subtly different hostname-extraction routine for the cassette path — exactly the kind of unintentional
    divergence C-003 was written to prevent for canonicalization, but here on a security-relevant redaction
    path (a divergent implementation could, e.g., handle a malformed URL or a credential-shaped userinfo
    component differently than the proven `hostnameOf`).

    '
  remediation: 'Add a constraint parallel to C-003: "`hostnameOf` (or an exported equivalent) MUST be
    reused by the cassette module — no parallel hostname-extraction/redaction implementation is added,"
    and note in FR-004 or Dependencies that `hostnameOf` needs to be exported from `src/core/behavioral/client.ts`
    as part of this work.

    '
  refute_reason: client.ts:57 defines `hostnameOf` with no `export` keyword and the file's export list
    (EmptyResponseError, ToolChatClient, makeClientWithTools, makeClient) omits it exactly as claimed,
    while C-003 (spec.md:249) sets a "no parallel implementation, mandate reuse" precedent for canonicalJson
    that C-004 (spec.md:250) does not parallel for hostnameOf, leaving a genuine reuse/export gap.
- id: SPEC-COMPLETE-006
  lens: determinism
  severity: 3
  title: C-006's sequential-execution invariant (no Promise.all around any model call) has no automated
    regression guard, unlike the other NI-guarded invariants it sits alongside
  evidence:
  - artifact: 'spec.md § C-006 (line 252): "the sequential-only, per-suite model-call execution model
      ... is preserved; this mission introduces no concurrent model-call path, since ordinal keying depends
      on strict sequencing"'
  - artifact: 'spec.md § Dependencies & Assumptions (lines 311-313): "all seven behavioral runners execute
      cases and runs sequentially — no Promise.all around any model call — confirmed in the current tree"'
  - code: tests/unit/invariants.test.ts:1-27 (module doc comment enumerating exactly NI-001/NI-002/NI-003
      — no fourth guard exists for concurrent-model-call detection)
  claim: 'FR-006''s ordinal-keying scheme (a k-of-n case with identical prompts replays n distinct responses
    "in recorded order") is only correct if model calls within a case are strictly sequential — C-006
    says exactly this. NI-002 (core/adapter boundary) and NI-003 (fetch call-site isolation) are both
    codified as automated, `pnpm test`-enforced regression guards in tests/unit/invariants.test.ts specifically
    because the mission''s other structural invariants (C-001/C-002) needed a guard stronger than a one-time
    manual check. C-006 is at least as load-bearing for correctness (it is the assumption FR-006''s determinism
    scheme depends on) but has no equivalent guard anywhere in the FR list — it is asserted as "confirmed
    in the current tree," a point-in-time fact with nothing stopping a future PR from introducing `Promise.all`
    around a model call and silently breaking cassette replay determinism.

    '
  remediation: 'Add an FR (or extend FR-021, which already touches the invariant suite) requiring a fourth
    automated guard (e.g. NI-004) in tests/unit/invariants.test.ts that scans for `Promise.all` wrapping
    a `.chat(`/`.chatWithTools(` call site across all runner files, analogous to the existing NI-002/NI-003
    pattern, so C-006 stays enforced rather than merely asserted.

    '
  refute_reason: tests/unit/invariants.test.ts's doc comment and describe blocks enumerate exactly NI-001/NI-002/NI-003
    with no Promise.all/concurrent-model-call scan, while grep confirms C-006's sequential-execution invariant
    is only asserted in prose comments across the codebase (e.g. crosslayer/rule-survival.ts, memory-utilization/index.ts)
    with no automated regression guard analogous to NI-002/NI-003.
- id: SPEC-COMPLETE-007
  lens: testability
  severity: 3
  title: NFR-001/AC-2's 'opt-in durationMs field' is never defined as part of the cassette exchange schema,
    and FR-004's exhaustive provenance wording arguably excludes it
  evidence:
  - artifact: 'spec.md § NFR-001 (line 235): "Recording the same suite twice ... yields byte-identical
      cassette files, modulo the opt-in durationMs field"'
  - artifact: 'spec.md § Acceptance Scenario 2 (lines 125-127): "the files are byte-identical except for
      the opt-in durationMs field"'
  - artifact: 'spec.md § FR-004 (line 210): "minimal provenance limited to the model name and the endpoint
      hostname only"'
  - artifact: 'spec.md § Key Entities "Exchange" (lines 277-279): lists request hash, ordinal, fully-built
      request, response, and provenance (requested model, endpoint hostname) — no durationMs'
  claim: 'NFR-001 and AC-2 both assume a cassette exchange (or case file) contains a durationMs field
    that is sometimes present ("opt-in") and excluded from byte-stability comparison. But FR-004 defines
    the exchange''s provenance as "limited to the model name and the endpoint hostname only," and the
    Key Entities "Exchange" definition — the closest thing to a schema in this spec — enumerates request
    hash, ordinal, request, response, and provenance (model, hostname) with no durationMs field at all.
    Nothing in FR-003, FR-004, or Key Entities defines what "opt-in" means (a CLI flag? a config toggle?
    always present but non-deterministic and thus excluded from comparison?), so the plan phase has no
    grounding for implementing this field, and a straightforward reading of FR-004''s "limited to X and
    Y" language would forbid adding it at all.

    '
  remediation: 'Add durationMs explicitly to FR-004''s provenance enumeration (or to a new field list)
    and state what "opt-in" means operationally — e.g. "durationMs is recorded when available but excluded
    from the RFC 8785 canonical form used for byte-stability comparison, matching FR-001''s real-timing
    requirement for SOP transcripts" — so NFR-001/AC-2 have a concrete field to test against.

    '
  refute_reason: Confirmed durationMs appears only in NFR-001/AC-2 (byte-stability) and FR-001/#90 (SOP
    transcript) contexts, and grep of spec.md shows it is never listed in FR-004's provenance enumeration
    or the Key Entities "Exchange" schema, leaving "opt-in" undefined exactly as claimed.
- id: SPEC-GOV-002
  lens: '[mission-derived] Neighbouring-mission boundaries'
  severity: 3
  title: '''Four gate-bearing commands'' in Summary/Non-Goals contradicts the six chat-based commands
    the same section names, and miscasts #103/M20 as a gate-bearing consumer'
  evidence:
  - artifact: 'spec.md § Summary ("the four gate-bearing commands in wave 2 (#100/#101/#102, plus the
      transitively-blocked #103) will consume unmodified")'
  - artifact: 'spec.md § Non-Goals ("The other six chat-based commands (skills run, sop run''s live endpoint
      probes beyond the #90 fix, crosslayer, tools, memory, heartbeat) — M17 (#100), M18 (#101), M19 (#102)
      wire cassette support into their own gate-bearing CLI surfaces.")'
  - artifact: spec.md § Non-Goals ("Any change to the four gate-bearing commands' own MUSTER_ENDPOINT
      skip-gate behavior.")
  - artifact: 'spec.md § Non-Goals ("Test-suite migration to cassette-backed fixtures (M20, #103)")'
  - code: src/cli/index.ts:942 (crosslayer skip-gate)
  - code: src/cli/index.ts:1646 (sop skip-gate)
  - code: src/cli/index.ts:2158 (heartbeat skip-gate)
  - code: src/cli/index.ts:2183 (skills skip-gate)
  - code: src/cli/index.ts:2245 (tools skip-gate)
  - code: src/cli/index.ts:2015-2033 (memory command — opt-in --behavioral flag, no MUSTER_ENDPOINT auto
      skip-gate)
  claim: 'The spec uses "four gate-bearing commands" twice (Summary; Non-Goals'' MUSTER_ENDPOINT bullet)
    but its own Non-Goals section separately names SIX chat-based commands (skills, sop, crosslayer, tools,
    memory, heartbeat) as the wave-2 surface those same three missions (#100/#101/#102) wire cassette
    support into. Verified against the CLI: skills, sop, crosslayer, tools, and heartbeat each implement
    a MUSTER_ENDPOINT-based skip-gate (cited above); "memory" (src/cli/index.ts:2014-2033) instead uses
    an explicit opt-in --behavioral flag with no MUSTER_ENDPOINT auto-gate — so at most five of the six
    named commands are actually "gate-bearing" today, not four, and not six. Separately, the Summary''s
    parenthetical "(#100/#101/#102, plus the transitively-blocked #103)" bundles #103/M20 into "the four
    gate-bearing commands," but the spec''s own Non-Goals and Dependencies&Assumptions sections describe
    #103/M20 as "Test-suite migration to cassette-backed fixtures" — not a CLI command with a gate at
    all. This is an internally inconsistent count of the resolver''s real downstream consumer surface,
    which matters directly for my lens (verifying the spec does not misrepresent wave-2/#103 boundaries)
    and could mislead the plan phase about how many CLI surfaces the execution-source resolver (FR-018)
    actually needs to serve.

    '
  remediation: 'Reconcile the command count: either correct "four gate-bearing commands" to the accurate
    number of commands that currently implement a MUSTER_ENDPOINT skip-gate (five, per the code cited
    above, once "memory" is excluded or its gate is separately clarified), or explain in prose why the
    resolver''s real consumer count differs from the six named chat-based commands. Remove #103/M20 from
    the "gate-bearing commands" parenthetical since the spec itself classifies #103 as test-fixture migration,
