- id: PR-FRESH-R2-001
  lens: fresh
  severity: 3
  title: A2A env-var row cites lines that define env-var name constants, not the 'kind
    must be behavioral' gate the sentence attributes to them
  evidence: "docs/guides/spec-kitty-conformance.md:156 reads: \"`a2a run` **only**,\n\
    when the manifest's `kind` is `\"behavioral\"`\n(`src/adapters/a2a/behavioral-manifest.ts:142-143`).\"\
    \ Lines 142-143 of\nthat file are:\n  142: const DEFAULT_ENDPOINT_ENV = \"MUSTER_A2A_ENDPOINT\"\
    ;\n  143: const DEFAULT_TOKEN_ENV = \"MUSTER_A2A_TOKEN\";\nThese two lines only\
    \ define the default env-var name strings; they say\nnothing about gating on manifest\
    \ `kind`. The actual `kind ===\n\"behavioral\"` check the sentence describes lives\
    \ at\nsrc/adapters/a2a/behavioral-manifest.ts:1096\n(`if (parsed[\"kind\"] !==\
    \ \"behavioral\") { ... '\"kind\" must be\n\"behavioral\" to select the behavioral\
    \ path (FR-004)' ... }`), 950+\nlines away from the cited location.\n"
  claim: 'Every other citation in this guide is placed immediately after the specific
    claim it supports and does contain that claim when read (verified individually:
    src/adapters/skills/trigger.ts:91-101; src/cli/index.ts:1531-1554, :1541-1544,
    :1748, :1873, :634-653, :644, :1321-1325, :2530-2544; examples/behave/manifest.yaml:16-17;
    kitty-specs/cts1-conformance-harness-01KTS86B/contracts/cli.md:8; README.md:73-76;
    site/src/content/docs/reference/cli.md:25 — all confirmed to match). This one
    citation breaks that pattern: a reader who follows it to verify "a2a run only
    reads MUSTER_A2A_ENDPOINT/TOKEN when kind is behavioral" lands on two unrelated
    constant declarations, not the kind-gating logic. The underlying substantive claim
    (a2a''s behavioral-manifest parser is the only place these vars are consulted,
    and that parser only runs for kind:"behavioral" manifests) is true, but the pinpoint
    citation does not verify it, which is exactly the defect class this guide''s own
    preamble (lines 3-6) claims to have eliminated by re-checking every citation against
    source.'
  remediation: Either cite src/adapters/a2a/behavioral-manifest.ts:1096-1102 (the
    actual `kind !== "behavioral"` validation) alongside or instead of 142-143, or
    reword the sentence so the 142-143 citation is clearly scoped to supporting only
    the env-var-name claim rather than the kind-gating claim it currently sits next
    to.
  source_artifact: docs/guides/spec-kitty-conformance.md
- id: PR-FRESH-R2-002
  lens: fresh
  severity: 1
  title: New chatWithTools regression test duplicates the inline ToolChatClient fake
    instead of extracting a shared helper
  evidence: 'tests/cassette/client.test.ts:216-225 (new PR-FRESH-004 test) defines
    an inline "const inner: ToolChatClient & { toolCalls: unknown[][] } = { toolCalls:
    [], async chat(...) {...}, async chatWithTools(...) {...} }" object literal that
    is structurally identical (same field names, same chat stub, same toolCalls.push
    pattern) to the pre-existing inline fake at tests/cassette/client.test.ts:46-55
    (the live-mode "passes chatWithTools through unchanged" test), differing only
    in the chatWithTools return-value expression. The file already has a fakeChatClient()
    helper (tests/cassette/client.test.ts:16-25) that factors out the analogous chat-only
    fake for every other test.'
  claim: 'A fakeToolChatClient() helper mirroring fakeChatClient() (parameterized
    on the chatWithTools return value) would have let the new PR-FRESH-004 test reuse
    existing infrastructure instead of re-typing the same object shape a second time.
    This is a pure DRY/maintenance nit. It does not weaken the regression test''s
    ability to catch a revert: reverting either the messages copy or the tools copy
    in src/core/cassette/client.ts''s chatWithTools independently fails this test
    (verified by temporarily reverting each fix in turn and running the test, then
    restoring). Does not need to block the PR.'
  remediation: 'Optional cleanup: extract a fakeToolChatClient(chatWithToolsImpl?)
    helper next to fakeChatClient() (tests/cassette/client.test.ts:16-25) and have
    both the live-mode "passes chatWithTools through unchanged" test (line 44) and
    the new PR-FRESH-004 test (line 210) construct their fake through it.'
  source_artifact: tests/cassette/client.test.ts
- id: PR-FRESH-R2-003
  lens: fresh
  severity: 4
  title: The claimed compile-time link is real in isolation but never actually enforced
    by any command this repo runs — the round-2 fix's stated guarantee does not fire
    in practice
  evidence: 'tests/cassette/discrimination-control.test.ts:54-59 (comment: "a future
    rename of any of these fields — especially `stale` ... breaks this file at compile
    time instead of silently degrading the assertion below to a no-op" backing `type
    ReplayVerdict = Pick<CaseVerdict, "id" | "passed" | "stale">;`); tsconfig.json:15-16
    (`"include": ["src/**/*.ts"]`, `"exclude": ["tests", "dist", "node_modules"]`);
    vitest.config.ts:6-10 (`typecheck: { enabled: true, include: ["tests/**/*.test.ts"],
    tsconfig: "tsconfig.json" }`); package.json:78 (`"typecheck": "tsc --noEmit"`);
    .github/workflows/ci.yml "Build (tsc strict)" step runs `pnpm build` and the "Test"
    step runs `pnpm test` (= `vitest run`) — neither other step type-checks tests/.
    Empirically verified by temporarily renaming `CaseVerdict.stale` to `staleRENAMED`
    in src/core/behavioral/types.ts (the exact scenario the comment cites) and running,
    in order: (1) `pnpm typecheck` (`tsc --noEmit`) — zero errors, anywhere, because
    tsconfig.json''s own `exclude: ["tests"]` keeps this file out of the program entirely;
    (2) `npx vitest run --typecheck` (both scoped to this file and for the full suite)
    — reports "Type Errors  no errors" and both tests still show a green `✓ TS` line;
    the expected TS2344 at line 59 never surfaces. To rule out a scoping fluke I additionally
    planted an unrelated, unambiguous type error directly in this file (`const __obviousTypeError:
    string = 12345;`) and reran `vitest run --typecheck` — it was ALSO not caught,
    proving vitest''s typecheck pass is not actually evaluating this file''s contents
    under the current wiring, independent of the CaseVerdict question. (3) As a control,
    I built an ad-hoc tsconfig extending tsconfig.json but with `include: ["src/**/*.ts",
    "tests/**/*.test.ts"]` (no `tests` exclude) and ran `tsc --noEmit -p` it directly:
    this correctly produced `tests/cassette/discrimination-control.test.ts(59,40):
    error TS2344: Type ''"id" | "passed" | "stale"'' does not satisfy the constraint
    ''keyof CaseVerdict''.` — confirming the Pick<> type mechanism itself is sound;
    it is the project wiring, not the type, that fails to invoke it. All edits were
    reverted (`git status --porcelain -uno` empty afterward, confirmed twice).'
  claim: 'The round-2 comment asserts a rename of `CaseVerdict.stale` "breaks this
    file at compile time instead of silently degrading the assertion below to a no-op."
    That is false for every command actually wired in this repo: `pnpm typecheck`
    never sees tests/ (tsconfig.json excludes it), and `pnpm test` — the command CI
    runs, and the one vitest.config.ts configures `typecheck.enabled: true` for —
    silently reports "no errors" for this file even under the exact rename the comment
    describes, and even under a deliberately planted, unrelated, blatant type error
    placed directly in the file. So under the repo''s actual build/test pipeline,
    a future rename of `stale` would compile clean, `pnpm build` would pass, `pnpm
    test`/CI would go green, and this test''s `stale`-vacuity guard would degrade
    to a no-op exactly as round 1 was found to risk — the round-2 revision fixes the
    type shape but not the enforcement gap that makes the shape matter, so the discrimination
    control''s own anti- regression safety net is not actually armed.'
  remediation: Either wire an actual gate that type-checks tests/ against src/ types
    (e.g. point vitest's `typecheck.tsconfig` at a project config that does not exclude
    tests/, or add a dedicated CI step running `tsc --noEmit` against a tests-inclusive
    project) and confirm the rename experiment above now fails red; or, if that's
    out of scope for this WP, soften the lines 54-58 comment so it doesn't promise
    a compile-time guarantee that isn't actually enforced by any command this repo
    runs today.
  source_artifact: tests/cassette/discrimination-control.test.ts
