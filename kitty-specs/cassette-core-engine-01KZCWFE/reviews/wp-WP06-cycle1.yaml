feedback:
  - id: WP06-C1-001
    severity: 1
    claim: >
      `pnpm test:coverage`'s v8 text-summary table (the artifact
      tasks.md/WP06 instructs reviewers to read: "inspect the v8 text/lcov
      summary ... assert each reports >=80% ... directly from the summary")
      silently omits every file under src/core/cassette/ and
      src/core/execution-source.ts entirely — not 0%, just absent rows.
      Reproduced independently: `pnpm test:coverage 2>&1 | grep -i
      "cassette\|execution-source"` returns nothing, while
      coverage/lcov.info's SF: records for the same run contain full,
      correct data for all 7 files (all at 100%). vitest.config.ts has no
      `coverage.all: true`, and something in the v8-provider's
      istanbul-report tree-building appears to drop these particular files
      from the printed table even though they were instrumented and
      recorded in lcov.info. Root cause not fully diagnosed (not required
      for this review — the underlying data is correct and I verified the
      actual percentages directly from lcov.info instead).
    remediation: >
      Not a correctness defect in this WP's deliverables — the real
      coverage is 100% for every new file, confirmed independently. But the
      WP06 task text's literal instruction ("assert...directly from the
      summary") is not achievable as written for these files with the
      current vitest.config.ts, which could cause a future implementer to
      either wrongly conclude the files are untested (if they don't know to
      check lcov.info) or skip verification because "nothing to assert
      against". Consider adding `coverage.all: true` to vitest.config.ts (or
      a doc note pointing at coverage/lcov.info as the fallback source of
      truth) in a future WP or fast-follow — advisory only, does not block
      WP06.
