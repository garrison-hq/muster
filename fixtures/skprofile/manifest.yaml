# NOT zero-findings (two warning-severity `reference-not-activated`
# findings) — see quickstart.md §3's own caveat and this WP's DoD.
# `examples/skprofile/manifest.yaml` is the one guaranteed-zero-findings run.
version: "1.0.0"
