# Muster-local fixture manifest (C-004, WP05 T017 step 5) — points at the
# clean/ profile set, the vendored schema (agent-profile.schema.yaml)
# pinned to its real upstream SHA, the muster-local doctrine tree, and the
# activation-config that exercises the FR-004 reference-not-activated
