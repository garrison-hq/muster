# here, not in projection-manifest.json, so that file keeps a strict
# 9-field entry shape with no non-schema `_comment` keys.) Per rubric §7.3
# this is a WARNING (the artefact exists, it is merely stale), never an
# error.
#
# Expected vector (this profile alone, against
# broken-projection-manifest.yaml): projection-hash-drift(warning), and
# nothing else.
profile-id: projection-hash-drift
name: Projection Hash Drift (fixture)
