# deliberately wrong 64-hex-digit placeholders that do not match the real
# sha256 of this file's own bytes or of outputs/hash-drift.md's bytes. (The
# real digests are c3734807cf8967130f0ece027257c4962c65f6aabf802c201f5d70e
# b280b2578 for this source .agent.yaml and 53e6d5e8e50fbd082c30e64e732983
