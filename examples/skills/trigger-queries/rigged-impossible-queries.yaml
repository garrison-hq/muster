id: example-rigged-impossible-queries
# Normative source for the 8-minimum-per-axis / near-miss methodology this
# query set follows (FR-006, T019): muster's own published rubric.
source: "docs/rubric/skills-trigger-taxonomy.md"
threshold: 0.5
# These are normal, plausible queries. The rigged skill's description is
# intentionally nonsensical (ZZZCONTROL-IMPOSSIBLE prefix, see
# RIGGED_IMPOSSIBLE_DESCRIPTION in trigger.ts). A well-functioning model
# should NEVER invoke the rigged tool for these queries.
# The discrimination control asserts: shouldTrigger trigger rate < threshold.
shouldTrigger:
  - "Draft an email to reschedule a meeting"
  - "What's the boiling point of water at sea level?"
  - "Convert 10 miles to kilometers"
  - "Give me a synonym for 'happy'"
  - "Write a haiku about autumn"
  - "What year did the Berlin Wall fall?"
  - "Summarize the plot of Romeo and Juliet"
  - "Explain the difference between TCP and UDP"
# Near-miss queries: realistic, topically-adjacent variants of the
# shouldTrigger queries above (same pattern as weather-skill-queries.yaml's
# own nearMiss axis) — plausible follow-on questions a model might see right
# after the shouldTrigger query, still nothing a well-functioning model would
# route to the rigged-impossible tool. Deliberately NOT the literal string
# "ZZZCONTROL": that string appears in the rigged tool's own description
# (RIGGED_IMPOSSIBLE_DESCRIPTION), so reusing it here would let the near-miss
# queries self-match the tool description by literal text overlap rather than
# by the model actually reasoning about tool fit — a fixture defect this file
# previously carried (HIGH-1 remediation; the pre-existing, out-of-scope
# instance of the same defect lives in fixtures/skills/trigger-queries/
# rigged-impossible-queries.yaml, tracked separately, not owned by this WP).
nearMiss:
  - "What's a good subject line for a reschedule email?"
  - "Why does water boil at a lower temperature at high altitude?"
  - "What's the formula for converting miles to kilometers?"
  - "What's another word similar to 'joyful'?"
  - "What makes a haiku different from a limerick?"
  - "What caused the fall of the Berlin Wall?"
  - "Who wrote Romeo and Juliet?"
  - "Why is TCP considered more reliable than UDP?"
