# Muster-local runnable example profile (WP05 T018, AC-1/Scenario 9,
# C-004) — self-contained within examples/skprofile/ (no reference back
# into fixtures/skprofile/). Deliberately uses the deprecated scalar
# `role` field (rather than `roles`) so this example set exercises both
# forms `profile.ts`'s `extractRoles` normalises (WP01), matching
# fixtures/skprofile/clean/planner.agent.yaml's construction discipline.
# Reciprocal handoffs with architect.agent.yaml; resolvable
# references/context-sources; no activation-config anywhere in
# examples/skprofile/, so this run has zero findings of any severity.
profile-id: planner
name: Planner (example)
description: >
  Muster-local runnable example profile (C-004) — the guaranteed-clean
  Scenario 9 demonstration, self-contained under examples/skprofile/.
purpose: >
  Sequence delivery work handed off from the architect profile in this
  muster-local fixture set.
role: planner

specialization:
  primary-focus: Task sequencing and delivery planning.
  secondary-awareness: Architectural constraints.
  avoidance-boundary: System design decisions.
  success-definition: An actionable, sequenced delivery plan.

collaboration:
  handoff-to:
    - architect
  handoff-from:
    - architect
  works-with:
    - architect

context-sources:
  directives:
    - "001"
  tactics:
    - development-bdd

directive-references:
  - code: "001"
    name: Architectural Integrity Standard
    rationale: Planner must respect architectural boundaries when sequencing work.

tactic-references:
  - id: development-bdd
    rationale: Plan delivery around the behavioral contracts established during design.
